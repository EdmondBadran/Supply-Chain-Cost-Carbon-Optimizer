<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Supply Chain Cost and Carbon Optimizer{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">Cost and Carbon Optimizer</a>
  {% if summary %}
  <form method="post" action="{{ url_for('clear') }}">
    <button class="link" type="submit">Clear data</button>
  </form>
  {% endif %}
</header>

<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
